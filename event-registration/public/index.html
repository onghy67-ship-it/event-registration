<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .category-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 10px;
    }
    .category-science { background: #e3f2fd; color: #1565c0; }
    .category-business { background: #f3e5f5; color: #7b1fa2; }
    
    .category-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .category-btn {
      padding: 15px 40px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .category-btn:hover { border-color: #4a90d9; transform: translateY(-2px); }
    
    .header.science-theme { background: linear-gradient(135deg, #004d40, #00897b); }
    .header.business-theme { background: linear-gradient(135deg, #4a148c, #7b1fa2); }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.5fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 900px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }
    
    /* Top Courses Card */
    .top-courses-card {
      background: white;
      border-radius: 12px;
      padding: 15px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .top-courses-card h4 {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .top-course-item {
      display: flex;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .top-course-item:last-child { border-bottom: none; }
    .top-course-rank {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      margin-right: 8px;
    }
    .rank-1 { background: #ffd700; color: #333; }
    .rank-2 { background: #c0c0c0; color: #333; }
    .rank-3 { background: #cd7f32; color: white; }
    .top-course-name {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-course-count {
      font-size: 1rem;
      font-weight: bold;
      color: #e67e22;
      margin-left: 8px;
    }
    .no-waiting { color: #999; font-style: italic; font-size: 0.9rem; padding: 10px 0; }
    
    /* Longest Wait Card */
    .longest-wait-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .longest-wait-card h4 {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .longest-wait-number {
      font-size: 2rem;
      font-weight: bold;
      color: #e74c3c;
    }
    .longest-wait-course {
      font-size: 0.8rem;
      color: #333;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .no-long-wait { color: #28a745; font-size: 0.9rem; }
    
    /* Status Colors */
    tr.status-urgent { background: #f8d7da; }
    tr.status-waiting { background: #ffe0b2; }
    tr.status-inside { background: #fff9c4; }
    tr.status-consulting { background: #bbdefb; }
    tr.status-ended { background: #c8e6c9; }
    tr.status-noanswer { background: #e0e0e0; }
    
    /* Filter */
    .filter-select {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      min-width: 250px;
      cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: #4a90d9; }
    
    /* Long wait alerts */
    tr.long-wait { position: relative; }
    tr.long-wait::before {
      content: '⏰';
      position: absolute;
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      animation: pulse-icon 1s infinite;
    }
    tr.long-wait td:first-child { padding-left: 30px; }
    
    tr.flash-alert { animation: flash-row 0.5s ease-in-out 5; }
    
    @keyframes flash-row {
      0%, 100% { background-color: inherit; }
      50% { background-color: #ff6b6b !important; }
    }
    @keyframes pulse-icon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .long-wait-number.alert {
      color: #dc3545 !important;
      animation: pulse-text 1s infinite;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    /* Notification popup */
    .notification-popup {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      max-width: 350px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: slide-in 0.3s ease-out;
    }
    @keyframes slide-in {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .notification-content {
      padding: 15px 20px;
      position: relative;
    }
    .notification-content strong { display: block; margin-bottom: 5px; font-size: 1rem; }
    .notification-content p { font-size: 0.9rem; margin: 0; opacity: 0.9; }
    .notification-content button {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.7;
      line-height: 1;
    }
    .notification-content button:hover { opacity: 1; }
    
    .notification-info { background: #e3f2fd; border-left: 4px solid #2196f3; color: #1565c0; }
    .notification-success { background: #e8f5e9; border-left: 4px solid #4caf50; color: #2e7d32; }
    .notification-warning { background: #fff3e0; border-left: 4px solid #ff9800; color: #e65100; }
    .notification-error { background: #ffebee; border-left: 4px solid #f44336; color: #c62828; }
    .notification-alert {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      color: #721c24;
      animation: shake-notification 0.5s ease-in-out;
    }
    @keyframes shake-notification {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    
    /* Offline mode */
    .sync-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .sync-indicator.synced { background: #28a745; }
    .sync-indicator.syncing { background: #ffc107; animation: pulse-indicator 1s infinite; }
    .sync-indicator.offline { background: #6c757d; }
    .sync-indicator.error { background: #dc3545; }
    @keyframes pulse-indicator {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .status-badge.offline { background: rgba(108, 117, 125, 0.2) !important; }
    
    /* Remark indicators */
    .remark-wrapper { position: relative; }
    .remark-saving {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: #666;
    }
    .remark-saving.saving { color: #ffc107; }
    .remark-saving.saved { color: #28a745; }
    .remark-saving.retry { color: #ff9800; }
    .remark-saving.offline-queued { color: #6c757d; }
    .remark-input:focus { outline: none; border-color: #4a90d9; background: white; }
  </style>
</head>
<body>
  <header class="header" id="header">
    <h1>
      <span id="eventName">Event Registration</span>
      <span class="category-badge" id="categoryBadge"></span>
    </h1>
    <p>Registration Dashboard 登记仪表板</p>
    <span class="status-badge" id="connectionStatus">
      <span class="sync-indicator synced"></span> Online
    </span>
  </header>

  <main class="container">
    <!-- Category Selector -->
    <div class="category-selector" id="categorySelector">
      <button class="category-btn" onclick="selectCategory('science')">
        🔬 Science & IT<br>理工科
      </button>
      <button class="category-btn" onclick="selectCategory('business')">
        💼 Business & Art<br>商科
      </button>
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display: none;">
      <!-- Stats -->
      <section class="stats-grid">
        <div class="top-courses-card">
          <h4>🔥 Top 3 Waiting 热门等候</h4>
          <div id="topCoursesContent">
            <div class="no-waiting">No one waiting</div>
          </div>
        </div>
        
        <div class="stat-card waiting">
          <div class="stat-number" id="waitingCount">0</div>
          <div class="stat-label">Waiting 等候</div>
        </div>
        
        <div class="stat-card inside">
          <div class="stat-number" id="insideCount">0</div>
          <div class="stat-label">Inside 里面</div>
        </div>
        
        <div class="longest-wait-card">
          <h4>⏰ Longest Wait 最久等候</h4>
          <div id="longestWaitContent">
            <div class="no-long-wait">✓ All good</div>
          </div>
        </div>
      </section>

      <!-- QR Code -->
      <section class="card qr-section">
        <h3>📱 <span id="qrTitle">Scan to Register</span></h3>
        <div class="qr-content">
          <div class="qr-box">
            <img id="qrCodeImage" src="" alt="QR Code">
          </div>
          <div class="qr-info">
            <p><strong>Registration URL:</strong></p>
            <code id="registrationUrl"></code>
            <div class="qr-actions">
              <button class="btn btn-outline" onclick="copyUrl()">📋 Copy</button>
              <button class="btn btn-outline" onclick="printQR()">🖨️ Print</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Table -->
      <section class="card table-section">
        <div class="table-header">
          <div class="filter-wrapper">
            <select id="filterSelect" class="filter-select" onchange="applyFilter()">
              <option value="">All Programmes 所有课程</option>
            </select>
          </div>
          <div class="table-actions">
            <button class="btn" onclick="switchCategory()">🔄 Switch</button>
            <button class="btn" onclick="refreshData()">🔄 Refresh</button>
            <a href="/admin.html" class="btn">⚙️ Admin</a>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Time 时间</th>
                <th>Name 姓名</th>
                <th>Phone 电话</th>
                <th>Programme 课程</th>
                <th>Status 状态</th>
                <th>Remark 备注</th>
                <th>Time In</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state">
          <span class="empty-icon">📋</span>
          <p>No registrations yet<br>暂无登记</p>
        </div>

        <div id="loadingState" class="loading-state">
          <div class="spinner"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
